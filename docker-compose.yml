services:
  database:
    image:  pgvector/pgvector:pg16
    container_name: wordwizard-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wordwizard}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./initDB:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    restart: no
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wordwizard}" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: