services:
  database:
    image: pgvector/pgvector:pg16
    container_name: wordwizard-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wordwizard}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./initDB:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wordwizard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wordwizard-app
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-wordwizard}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      GOOGLE_GENAI_API_KEY: ${GOOGLE_GENAI_API_KEY}
    stdin_open: true
    tty: true
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local