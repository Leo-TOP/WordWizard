services:
  database:
    image: postgres:16
    container_name: wordwizard-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wordwizard}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./initDB:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    container_name: wordwizard-app
    depends_on:
      - database
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://database:5432/wordwizard}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  postgres_data: